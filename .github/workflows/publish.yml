name: Publish NuGet Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore NetSsdp.slnx

      - name: Set package version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "PACKAGE_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Pack NuGet package
        run: |
          if [ -n "$PACKAGE_VERSION" ]; then
            echo "Using package version: $PACKAGE_VERSION"
            VERSION_ARG="--version $PACKAGE_VERSION"
          else
            echo "Using version from project file"
            VERSION_ARG=""
          fi

          dotnet pack \
            --configuration Release \
            --output ./nupkg \
            --no-restore \
            $VERSION_ARG

      - name: Push package to NuGet.org
        uses: nuget/setup-nuget@v3

      - name: Publish package
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          for pkg in ./nupkg/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
